<!DOCTYPE html>
<html>
  <body>
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="bot-field" />
      <select name="service">
        <option>AHC for travel to the EU</option>
        <option>Australia export</option>
        <option>Other</option>
      </select>
      <input name="fit_to_fly" type="checkbox" value="Yes" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="postcode" />
      <input name="destination" />
      <input name="travel_date" type="date" />
      <input name="pets" />
      <textarea name="message"></textarea>
      <input name="availability" />
      <input name="clinical_notes_1" type="file" />
      <input name="clinical_notes_2" type="file" />
      <input name="clinical_notes_3" type="file" />
    </form>
  </body>
</html>
